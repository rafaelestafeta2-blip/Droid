name: Build DroidStudio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare environment files
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        fi
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info": {"project_number": "123456789012", "project_id": "placeholder-project", "storage_bucket": "placeholder-project.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:1234567890abcdef", "android_client_info": {"package_name": "com.example"}}, "api_key": [{"current_key": "AIzaSyD-1234567890abcdef1234567890abcdef"}]}]}' > app/google-services.json
        fi

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Djava.awt.headless=true --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DroidStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
